apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: monitoring
spec:
  replicas: 2

  selector:
    matchLabels:
      app: test-app

  template:
    metadata:
      labels:
        app: test-app

      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"

    spec:
      containers:
        - name: test-app
          image: kodekloud/prometheus-example-app:latest

          ports:
            - containerPort: 8000