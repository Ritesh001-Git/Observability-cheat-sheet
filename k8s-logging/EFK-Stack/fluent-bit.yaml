apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: logging

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read

rules:

  - apiGroups:
      - ""

    resources:
      - pods
      - namespaces

    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read

roleRef:

  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read

subjects:

  - kind: ServiceAccount
    name: fluent-bit
    namespace: logging

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging

data:

  fluent-bit.conf: |

    [SERVICE]
        Flush         1
        Log_Level     info
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Parser            cri
        Tag               kube.*
        Refresh_Interval  5
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Merge_Log           On
        Keep_Log            Off

    [OUTPUT]
        Name                es
        Match               kube.*
        Host                elasticsearch.logging.svc.cluster.local
        Port                9200
        Logstash_Format     On
        Logstash_Prefix     kubernetes
        Retry_Limit         False

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging

spec:

  selector:
    matchLabels:
      app: fluent-bit

  template:

    metadata:
      labels:
        app: fluent-bit

    spec:

      serviceAccountName: fluent-bit

      containers:

        - name: fluent-bit

          image: cr.fluentbit.io/fluent/fluent-bit:3.2.2

          ports:

            - containerPort: 2020

          volumeMounts:

            - name: config
              mountPath: /fluent-bit/etc/

            - name: varlog
              mountPath: /var/log

            - name: containers
              mountPath: /var/log/containers
              readOnly: true

      volumes:

        - name: config

          configMap:
            name: fluent-bit-config

        - name: varlog

          hostPath:
            path: /var/log

        - name: containers

          hostPath:
            path: /var/log/containers