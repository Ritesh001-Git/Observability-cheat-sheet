apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: logging

data:

  logstash.yml: |
    http.host: "0.0.0.0"

  logstash.conf: |

    input {
      file {
        path => "/var/log/containers/*.log"
        start_position => "beginning"
        sincedb_path => "/dev/null"
        mode => "tail"
      }
    }

    filter {

      grok {
        match => {
          "message" => "^%{TIMESTAMP_ISO8601:log_time} %{WORD:stream} %{WORD:flag} %{GREEDYDATA:log_message}$"
        }
      }

      date {
        match => ["log_time", "ISO8601"]
        target => "@timestamp"
      }

      mutate {
        add_field => {
          "source_type" => "kubernetes-container"
        }
      }
    }

    output {

      elasticsearch {
        hosts => ["http://elasticsearch.logging.svc.cluster.local:9200"]
        index => "kubernetes-logs-%{+YYYY.MM.dd}"
      }

      stdout {
        codec => rubydebug
      }
    }

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: logstash
  namespace: logging

spec:

  selector:
    matchLabels:
      app: logstash

  template:

    metadata:
      labels:
        app: logstash

    spec:

      containers:

        - name: logstash

          image: docker.elastic.co/logstash/logstash:7.17.26

          ports:

            - containerPort: 9600

          volumeMounts:

            - name: config
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml

            - name: pipeline
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf

            - name: varlog
              mountPath: /var/log
              readOnly: true

      volumes:

        - name: config
          configMap:
            name: logstash-config

        - name: pipeline
          configMap:
            name: logstash-config

        - name: varlog
          hostPath:
            path: /var/log